[package]
name = "cli_boilerplate_automation"
version = "0.6.1"
edition = "2024"
description = "Cli Boilerplate Automation: Opiniated Cli Utilities for Basic Tasks"
repository = "https://github.com/Squirreljetpack/cba"
license-file = "LICENSE"

[dependencies]
cfg-if = "1.0.4"
dirs = "6.0.0"
easy-ext = "1.0.3"
libc = "0.2.189"
log = "0.4.33"
thiserror = "2.0.19"
unicode-width = { version = "0.2", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
which = "8.0.5"
anyhow = "1.0.104"
anstyle = "1.0"
anstream = "1.0"

[features]
bring = ["dep:unicode-width"] # string
serde = ["dep:serde"]

[lib]
  name = "cba"
  path = "src/lib.rs"
