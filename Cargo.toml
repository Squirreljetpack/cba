[package]
name = "cli_boilerplate_automation"
version = "0.3.0"
edition = "2024"
description = "Cli Boilerplate Automation: Opiniated Cli Utilities for Basic Tasks"
repository = "https://github.com/Squirreljetpack/cba"
license-file = "LICENSE"

[dependencies]
cfg-if = "1.0.4"
dirs = "6.0.0"
easy-ext = "1.0.2"
libc = "0.2.178"
log = "0.4.29"
thiserror = "2.0.17"
unicode-width = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
which = "8.0.0"
anyhow = "1.0.100"
anstyle = "1.0"
anstream = "0.6"

[features]
bring = ["dep:unicode-width"] # string
serde = ["dep:serde"]

[lib]
  name = "cba"
  path = "src/lib.rs"
